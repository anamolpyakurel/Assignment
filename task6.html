<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>
        <label>Name:</label><br>
        <input type="text" name="name"><br><br>
        <label>Email:</label><br>
        <input type="email" name="email"><br><br>
        <label>Password:</label><br>
        <input type="password" name="password"><br><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female<br><br>
        <label>Interests:</label><br>
        <input type="checkbox" name="interest" value="coding"> Coding<br>
        <input type="checkbox" name="interest" value="gaming"> Gaming<br>
        <input type="checkbox" name="interest" value="sports"> Sports<br><br>
        <label>Department:</label><br>
        <select name="department">
            <option value="se">Software Engineering</option>
            <option value="cs">Computer Science</option>
            <option value="it">Information Technology</option>
        </select><br><br>
        <label>About You:</label><br>
        <textarea name="about" rows="4" cols="30"></textarea><br><br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
